<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Execution Engine — trailer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0c0b11;
    font-family: Inter, system-ui, sans-serif; color: #ece8e1; }
  #bg, #root, #fg { position: absolute; inset: 0; }
  #root { transform-origin: 50% 50%; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .serif { font-family: "Source Serif 4", Georgia, serif; }
  .mono { font-family: "JetBrains Mono", Menlo, monospace; }
  .chip { position: absolute; left: 96px; top: 76px; display: flex; align-items: center; gap: 14px;
    font: 600 22px/1 Inter; letter-spacing: .14em; text-transform: uppercase; color: #a8a197; }
  .chip i { width: 12px; height: 12px; border-radius: 50%; background: #ef8a5c; box-shadow: 0 0 18px #ef8a5c; }
  .panel { position: absolute; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.09);
    border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05); }
  .node { position: absolute; padding: 14px 22px; border-radius: 14px; background: #17161e;
    border: 1.5px solid rgba(255,255,255,.14); font: 600 24px/1.1 Inter; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .node small { display: block; font: 400 17px/1.3 "JetBrains Mono"; color: #a8a197; margin-top: 6px; }
  .pill { position: absolute; padding: 7px 14px; border-radius: 999px; font: 600 18px/1 "JetBrains Mono";
    white-space: nowrap; color: #0c0b11; }
  .kw { color: #ef8a5c; } .st { color: #a993f0; } .nm { color: #5cc2c0; } .dim { color: #6f695f; }
  .big-num { font: 700 64px/1 "JetBrains Mono"; letter-spacing: -.02em; }
  .label { font: 600 18px/1 Inter; letter-spacing: .12em; text-transform: uppercase; color: #a8a197; }
  .cell { position: absolute; border-radius: 2px; }
  .lst { font: 500 25px/40px "JetBrains Mono"; }
  .lst .row { position: absolute; left: 0; right: 0; height: 40px; padding-left: 22px; white-space: pre; }
  .reg { position: absolute; width: 110px; height: 70px; border-radius: 12px; background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1); text-align: center; }
  .reg b { display: block; font: 600 15px/1 Inter; color: #6f695f; margin-top: 10px; letter-spacing: .08em; }
  .reg span { display: block; font: 600 24px/1 "JetBrains Mono"; margin-top: 10px; }
</style>
</head>
<body>
<div style="position:absolute;opacity:0;pointer-events:none"><span class="serif" style="font-weight:600">Aa</span><span class="serif"><i>Aa</i></span><span class="serif">Aa</span><span class="mono">Aa</span><span class="mono" style="font-weight:700">Aa</span><span style="font-weight:600">Aa</span><span style="font-weight:700">Aa</span></div>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="root"></div>
  <canvas id="fg" width="1920" height="1080"></canvas>
</div>
<script src="build/timeline.js"></script>
<script>
"use strict";
// ============================================================================================
// Deterministic motion graphics: renderAt(t) draws the frame at time t (seconds). No timers,
// no CSS transitions — the capture script calls renderAt for every frame.
// ============================================================================================
const C = { ink: "#0c0b11", text: "#ece8e1", soft: "#a8a197", faint: "#6f695f", accent: "#ef8a5c",
  teal: "#5cc2c0", violet: "#a993f0", good: "#7ccf7f", bad: "#f08a83", panel: "#17161e" };

// ---------- math / easing ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeIO = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const easeOut = (u) => 1 - Math.pow(1 - u, 3);
const easeIn = (u) => u * u * u;
const easeExpo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const back = (u) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const fmtN = (n) => Math.round(n).toLocaleString("en-US");

// ---------- DOM helpers ----------
const root = document.getElementById("root");
function h(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || root).appendChild(e);
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgLayer(parent) {
  return s("svg", { width: 1920, height: 1080, viewBox: "0 0 1920 1080", style: "position:absolute;left:0;top:0;overflow:visible" }, parent || root);
}
// Position an element by its center.
function at(e, x, y, o = {}) {
  const sc = o.scale ?? 1, op = o.opacity ?? 1, blur = o.blur ?? 0, rot = o.rot ?? 0;
  e.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${sc}) rotate(${rot}deg)`;
  e.style.opacity = op;
  e.style.filter = blur > 0.05 ? `blur(${blur}px)` : "none";
}
// Fade-in-up helper: appear starting at time a over d seconds.
function rise(e, x, y, t, a, d = 0.5, dist = 24, extra = {}) {
  const u = easeOut(prog(t, a, a + d));
  at(e, x, y + (1 - u) * dist, { opacity: u * (extra.opacity ?? 1), blur: (1 - u) * 8, scale: extra.scale ?? 1 });
}
function chip(text) { return h("div", "chip", root, `<i></i>${text}`); }
function chipUpdate(e, t) { const u = easeOut(prog(t, 0.1, 0.6)); e.style.opacity = u; e.style.transform = `translateX(${(1 - u) * -20}px)`; }

// Points along a polyline by fraction u (by length).
function along(pts, u) {
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
  let target = clamp(u) * total;
  for (let i = 0; i < seg.length; i++) {
    if (target <= seg[i] || i === seg.length - 1) { const v = seg[i] ? target / seg[i] : 0; return [lerp(pts[i][0], pts[i + 1][0], clamp(v)), lerp(pts[i][1], pts[i + 1][1], clamp(v))]; }
    target -= seg[i];
  }
  return pts[pts.length - 1];
}

// ---------- the dataset (DESIGN.md generator) ----------
const DATA = (() => {
  let state = 42n; const M = (1n << 64n) - 1n;
  const next = () => { state = (state * 6364136223846793005n + 1442695040888963407n) & M; return Number(state >> 33n); };
  const intn = (n) => next() % n;
  const cities = ["Austin", "Boston", "Chicago", "Denver", "Miami", "Oakland", "Portland", "Seattle"];
  const customers = [], orders = [];
  for (let id = 1; id <= 200; id++) {
    const r = intn(100);
    const city = r < 40 ? cities[0] : r < 60 ? cities[1] : r < 72 ? cities[2] : cities[3 + intn(5)];
    let age = 18 + intn(60); if (id % 17 === 0) age = null;
    customers.push({ id, name: "cust" + id, city, age });
  }
  for (let id = 1; id <= 50; id++) { intn(5); intn(9900); }
  for (let id = 1; id <= 5000; id++) {
    const r = intn(100);
    const customer_id = r < 50 ? 1 + intn(20) : 1 + intn(200);
    intn(50); intn(5); intn(365);
    orders.push({ id, customer_id });
  }
  return { customers, orders };
})();

// ---------- background ----------
const bg = document.getElementById("bg").getContext("2d");
const fg = document.getElementById("fg").getContext("2d");
const grain = [];
for (let k = 0; k < 6; k++) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"); const img = g.createImageData(256, 256);
  let seed = 1234 + k * 977;
  for (let i = 0; i < img.data.length; i += 4) { seed = (seed * 16807) % 2147483647; const v = seed & 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); grain.push(c);
}
let BG = { tint: 0 }; // scenes may set BG.tint (0..1 desaturate/darken)
function drawBg(t) {
  bg.globalCompositeOperation = "source-over";
  bg.fillStyle = C.ink; bg.fillRect(0, 0, 1920, 1080);
  const blobs = [
    [960 + Math.sin(t * 0.11) * 520, 380 + Math.cos(t * 0.09) * 200, 760, "239,138,92", 0.16],
    [500 + Math.cos(t * 0.07 + 1) * 380, 800 + Math.sin(t * 0.1) * 160, 680, "92,194,192", 0.11],
    [1500 + Math.sin(t * 0.08 + 2) * 300, 700 + Math.cos(t * 0.06) * 220, 720, "169,147,240", 0.12],
  ];
  for (const [x, y, r, col, a] of blobs) {
    const g = bg.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},${a * (1 - BG.tint * 0.8)})`); g.addColorStop(1, `rgba(${col},0)`);
    bg.fillStyle = g; bg.fillRect(0, 0, 1920, 1080);
  }
  // dot grid drifting slowly
  bg.fillStyle = "rgba(255,255,255,0.05)";
  const off = (t * 8) % 48;
  for (let x = -48 + off; x < 1920; x += 48) for (let y = -48 + off * 0.5; y < 1080; y += 48) bg.fillRect(x, y, 2, 2);
  // vignette
  const v = bg.createRadialGradient(960, 540, 300, 960, 540, 1150);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.7)");
  bg.fillStyle = v; bg.fillRect(0, 0, 1920, 1080);
}
function drawFg(t, frame) {
  fg.clearRect(0, 0, 1920, 1080);
  fg.globalAlpha = 0.045; fg.globalCompositeOperation = "source-over";
  const pat = fg.createPattern(grain[frame % grain.length], "repeat");
  fg.fillStyle = pat; fg.fillRect(0, 0, 1920, 1080);
  fg.globalAlpha = 1;
}

// ============================================================================================
// Scenes. build(S) creates DOM once; update(st, t, S) sets every property for local time t.
// S.p[i] = phrase i start (scene-relative), S.e[i] = phrase i end, S.dur = scene length.
// ============================================================================================
const SCENES = {};

// ---------- shared: the query tree (hook + inside) ----------
const TREE = {
  agg:    { x: 1360, y: 230, title: "Aggregate", sub: "sum(o.qty) by c.name" },
  filter: { x: 1360, y: 400, title: "Filter", sub: "c.city = 'Austin'" },
  join:   { x: 1360, y: 570, title: "Join", sub: "o.customer_id = c.id" },
  scanC:  { x: 1150, y: 760, title: "Scan", sub: "customers c" },
  scanO:  { x: 1570, y: 760, title: "Scan", sub: "orders o" },
};
const TREE_EDGES = [["agg", "filter"], ["filter", "join"], ["join", "scanC"], ["join", "scanO"]];
function buildTree(parent) {
  const svg = svgLayer(parent);
  const edges = TREE_EDGES.map(([a, b]) => {
    const A = TREE[a], B = TREE[b];
    const d = `M${A.x},${A.y + 40} C${A.x},${(A.y + B.y) / 2 + 10} ${B.x},${(A.y + B.y) / 2 - 10} ${B.x},${B.y - 40}`;
    const p = s("path", { d, fill: "none", stroke: "rgba(255,255,255,.22)", "stroke-width": 2.5 }, svg);
    const len = p.getTotalLength(); p.style.strokeDasharray = len; return { p, len };
  });
  const nodes = {};
  for (const k in TREE) nodes[k] = h("div", "node abs", parent, `${TREE[k].title}<small>${TREE[k].sub}</small>`);
  return { svg, edges, nodes };
}
function nodeGlow(e, g, color = C.accent) {
  e.style.borderColor = g > 0.02 ? color : "rgba(255,255,255,.14)";
  e.style.boxShadow = `0 10px 30px rgba(0,0,0,.4), 0 0 ${40 * g}px ${color}`;
}

// ---------- 1. hook: SQL types in, becomes a tree ----------
SCENES.hook = {
  fadeOut: false,
  build(S) {
    const lines = [
      `<span class="kw">SELECT</span> c.name, <span class="nm">sum</span>(o.qty)`,
      `<span class="kw">FROM</span> customers c`,
      `<span class="kw">JOIN</span> orders o <span class="kw">ON</span> o.customer_id = c.id`,
      `<span class="kw">WHERE</span> c.city = <span class="st">'Austin'</span>`,
      `<span class="kw">GROUP BY</span> c.name`,
    ];
    const code = h("div", "abs mono", root); code.style.cssText += "font-size:40px;line-height:68px;left:150px;top:300px;transform:none";
    const lineEls = lines.map((l) => { const d = h("div", "", code); d.dataset.html = l; d.dataset.text = d.innerHTML = l; d.innerHTML = ""; return d; });
    const tree = buildTree(root);
    return { code, lineEls, tree, lines };
  },
  update(st, t, S) {
    const p0 = S.p[0];
    // typing: total characters revealed over [0.15, p0 + 1.0]
    const plain = st.lines.map((l) => l.replace(/<[^>]+>/g, ""));
    const totalChars = plain.reduce((a, b) => a + b.length, 0);
    let shown = Math.floor(totalChars * easeIO(prog(t, 0.15, p0 + 1.1)));
    st.lineEls.forEach((el, i) => {
      const n = Math.min(plain[i].length, Math.max(0, shown)); shown -= plain[i].length;
      el.innerHTML = truncateHTML(st.lines[i], n) + (n > 0 && n < plain[i].length ? `<span style="color:${C.accent}">▍</span>` : "");
    });
    // code drifts left + dims as tree arrives; fades out at the very end
    const m = easeIO(prog(t, p0 + 1.2, p0 + 2.0));
    st.code.style.transform = `translate(${-m * 40}px, 0) scale(${1 - m * 0.12})`;
    st.code.style.transformOrigin = "0 50%";
    st.code.style.opacity = 1 - 0.45 * m - 0.55 * prog(t, S.dur - 0.5, S.dur);
    // tree: nodes appear in parse order, linked to lines
    const order = [["scanC", 1], ["scanO", 2], ["join", 2], ["filter", 3], ["agg", 0]];
    const t0 = p0 + 1.05;
    order.forEach(([k, line], i) => {
      const a = t0 + i * 0.22, u = prog(t, a, a + 0.5);
      const N = TREE[k]; at(st.tree.nodes[k], N.x, N.y, { opacity: easeOut(u), scale: 0.6 + 0.4 * back(u), blur: (1 - u) * 6 });
      const g = Math.max(0, 1 - Math.abs(t - (a + 0.3)) / 0.5);
      nodeGlow(st.tree.nodes[k], g * 0.9);
      st.lineEls[line].style.color = g > 0.3 ? C.text : "";
      st.lineEls[line].style.textShadow = g > 0.05 ? `0 0 ${24 * g}px rgba(239,138,92,.8)` : "none";
    });
    st.tree.edges.forEach(({ p, len }, i) => {
      const a = t0 + 0.35 + (3 - i) * 0.2;
      p.style.strokeDashoffset = len * (1 - easeIO(prog(t, a, a + 0.45)));
    });
  },
};
function truncateHTML(html, n) {
  // reveal n visible characters of an html string with simple spans
  let out = "", count = 0, i = 0;
  while (i < html.length && count < n) {
    if (html[i] === "<") { const j = html.indexOf(">", i); out += html.slice(i, j + 1); i = j + 1; continue; }
    out += html[i++]; count++;
  }
  // close an open span
  const opens = (out.match(/<span/g) || []).length, closes = (out.match(/<\/span>/g) || []).length;
  return out + "</span>".repeat(Math.max(0, opens - closes));
}

// ---------- 2. inside: rows flow up through the tree, then we dive in ----------
SCENES.inside = {
  fadeIn: false,
  build(S) {
    const wrap = h("div", "abs", root); wrap.style.cssText = "position:absolute;inset:0;transform-origin:1360px 570px";
    const tree = buildTree(wrap);
    tree.edges.forEach(({ p }) => (p.style.strokeDashoffset = 0));
    const resultTitle = h("div", "abs label", wrap, "result");
    const result = h("div", "abs mono", wrap); result.style.cssText += "font-size:34px;line-height:56px";
    const rows = ["Ada  │ 3", "Cy   │ 5"].map((r) => h("div", "", result, r));
    // particles: label, color, path, start, dur, fail?
    const P = [];
    const pC = [[TREE.scanC.x, TREE.scanC.y - 40], [TREE.join.x - 60, TREE.join.y + 30]];
    const pO = [[TREE.scanO.x, TREE.scanO.y - 40], [TREE.join.x + 60, TREE.join.y + 30]];
    const pJF = [[TREE.join.x, TREE.join.y - 40], [TREE.filter.x, TREE.filter.y + 30]];
    const pFA = [[TREE.filter.x, TREE.filter.y - 40], [TREE.agg.x, TREE.agg.y + 30]];
    ["Ada", "Bo", "Cy", "Di"].forEach((n, i) => P.push({ label: n, color: C.teal, path: pC, a: 0.35 + i * 0.32, d: 0.55 }));
    ["#10", "#11", "#12", "#13", "#14"].forEach((n, i) => P.push({ label: n, color: C.accent, path: pO, a: 0.45 + i * 0.28, d: 0.55 }));
    [["Ada·#10", 0], ["Ada·#11", 0], ["Cy·#12", 0], ["Di·#13", 1]].forEach(([n, f], i) =>
      P.push({ label: n, color: C.violet, path: pJF, a: 1.6 + i * 0.3, d: 0.5, fail: f }));
    [["Ada·#10"], ["Ada·#11"], ["Cy·#12"]].forEach(([n], i) => P.push({ label: n, color: C.violet, path: pFA, a: 2.25 + i * 0.3, d: 0.45 }));
    for (const q of P) q.el = h("div", "pill abs", wrap, q.label);
    return { wrap, tree, P, rows, result, resultTitle };
  },
  update(st, t, S) {
    const { tree, P } = st;
    for (const k in TREE) { at(tree.nodes[k], TREE[k].x, TREE[k].y); nodeGlow(tree.nodes[k], 0); }
    for (const q of P) {
      const u = prog(t, q.a, q.a + q.d);
      const [x, y] = along(q.path, easeIO(u));
      let op = u > 0 && u < 1 ? 1 : 0, color = q.color, dy = 0;
      if (q.fail && u >= 1) { const v = prog(t, q.a + q.d, q.a + q.d + 0.6); op = 1 - v; color = C.bad; dy = v * 60; }
      q.el.style.background = color;
      at(q.el, x, y + dy, { opacity: op * Math.min(1, u * 6), scale: q.fail && u >= 1 ? 1 - 0.3 * prog(t, q.a + q.d, q.a + q.d + 0.6) : 1 });
      // glow node at arrival
      if (u > 0.85 && u <= 1) {
        const end = q.path[q.path.length - 1];
        const key = Object.keys(TREE).find((k) => Math.abs(TREE[k].x - end[0]) < 80 && Math.abs(TREE[k].y - end[1]) < 80);
        if (key) nodeGlow(tree.nodes[key], 0.8, q.fail && u >= 1 ? C.bad : q.color);
      }
    }
    // aggregate emits results to the left
    rise(st.resultTitle, 360, 330, t, 3.1, 0.5);
    st.result.style.left = "0"; st.result.style.top = "0";
    at(st.result, 360, 420, { opacity: 1 });
    st.rows.forEach((r, i) => {
      const u = easeOut(prog(t, 3.3 + i * 0.3, 3.8 + i * 0.3));
      r.style.opacity = u; r.style.transform = `translateX(${(1 - u) * 160}px)`;
      r.style.color = C.text;
    });
    if (t > 3.2 && t < 4.2) nodeGlow(tree.nodes.agg, 1 - prog(t, 3.6, 4.2), C.good);
    // dive into the join: "most of us never look inside"
    const z = easeIn(prog(t, S.p[1] + 0.5, S.dur));
    st.wrap.style.transform = `scale(${1 + z * 5})`;
    st.wrap.style.filter = z > 0.01 ? `blur(${z * 10}px)` : "none";
    st.wrap.style.opacity = 1 - prog(t, S.dur - 0.45, S.dur);
  },
};

// ---------- 3. title ----------
SCENES.title = {
  build(S) {
    const kicker = h("div", "abs label", root, "Let's build one"); kicker.style.fontSize = "26px"; kicker.style.letterSpacing = ".3em"; kicker.style.color = C.accent;
    const words = ["Building", "a", "query", "execution", "engine"].map((w) => { const e = h("div", "abs serif", root, w); e.style.cssText += "font-size:118px;font-weight:600;letter-spacing:-.02em"; return e; });
    const sub = h("div", "abs", root, "from scratch &nbsp;·&nbsp; in seven parts"); sub.style.cssText += `font-size:34px;color:${C.soft}`;
    const line = h("div", "abs", root); line.style.cssText += `height:4px;border-radius:2px;background:linear-gradient(90deg,${C.accent},${C.violet})`;
    const parts = ["Expressions", "Iterators", "Joins", "Aggregation", "Indexes", "Planning", "Bytecode"];
    const chips = parts.map((p, i) => h("div", "abs", root, `<span class="mono" style="color:${C.accent};font-weight:700">0${i + 1}</span>&nbsp; ${p}`));
    chips.forEach((c) => (c.style.cssText += "font-size:24px;font-weight:500;padding:14px 22px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);white-space:nowrap"));
    return { kicker, words, sub, line, chips };
  },
  update(st, t, S) {
    const p0 = S.p[0], p1 = S.p[1];
    const ku = easeOut(prog(t, p0 - 0.1, p0 + 0.5));
    at(st.kicker, 960, 300 - (1 - ku) * 10, { opacity: ku, blur: (1 - ku) * 6 });
    st.kicker.style.letterSpacing = `${0.3 + (1 - ku) * 0.3}em`;
    // words laid out on one line: measure widths once
    { const gap = 30; const ws = st.words.map((w) => w.getBoundingClientRect().width); const total = ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1); let x = 960 - total / 2; st.wx = ws.map((w) => { const c = x + w / 2; x += w + gap; return c; }); }

function vmTrace() {
  // A real tiny VM run over the generated customers: SELECT name FROM customers WHERE age > 40
  const prog = [
    ["Init", 0, 10, "", ""], ["OpenScan", 0, "", "", "customers"], ["Rewind", 0, 9, "", ""],
    ["Column", 0, 3, 1, "r1 = age"], ["Gt", 1, 2, 3, "r3 = r1 > r2"], ["IfNot", 3, 8, "", ""],
    ["Column", 0, 1, 4, "r4 = name"], ["ResultRow", 4, 1, "", "yield row"], ["Next", 0, 3, "", ""],
    ["Halt", "", "", "", ""], ["Const", 2, 40, "", "r2 = 40"], ["Goto", 0, 1, "", ""],
  ];
  const rows = DATA.customers;
  const states = []; let pc = 0, regs = [null, null, null, null, null], cur = -1, out = [];
  for (let step = 0; step < 400; step++) {
    states.push({ pc, regs: regs.slice(), cur, out: out.slice() });
    const [op, a, b, c] = prog[pc];
    if (op === "Halt") break;
    switch (op) {
      case "Init": pc = b; continue;
      case "Const": regs[a] = b; pc++; continue;
      case "Goto": pc = b; continue;
      case "OpenScan": cur = -1; pc++; continue;
      case "Rewind": cur = 0; pc++; continue;
      case "Column": regs[c] = b === 3 ? rows[cur].age : rows[cur].name; pc++; continue;
      case "Gt": regs[c] = regs[a] == null ? null : regs[a] > regs[b]; pc++; continue;
      case "IfNot": pc = regs[a] === true ? pc + 1 : b; continue;
      case "ResultRow": out.push(regs[a] + " · " + rows[cur].age); pc++; continue;
      case "Next": cur++; pc = cur < rows.length ? b : pc + 1; continue;
    }
  }
  return { prog, states };
}

}
function S_of(sc) {

};
window.TOTAL = TLN.total;
// Live preview when opened directly: ?t=12.3 shows a frame; otherwise plays in real time.
(async () => {
  await document.fonts.ready;
  const q = new URLSearchParams(location.search);
  if (window.__capture) return;
  if (q.has("t")) { renderAt(parseFloat(q.get("t"))); return; }
  const t0 = performance.now(); let f = 0;
  const loop = () => { const T = ((performance.now() - t0) / 1000) % TLN.total; renderAt(T, f++); requestAnimationFrame(loop); };
  loop();
})();
</script>
