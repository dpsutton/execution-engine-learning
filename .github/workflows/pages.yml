name: Pages

# Builds the WebAssembly binaries into docs/wasm/ (never committed), checks the site, and deploys
# docs/ as the Pages artifact. Pages source must be "GitHub Actions" (Settings → Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.mod }
      - uses: actions/setup-node@v7.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: tools/check-site/package-lock.json }
      - name: build Go → WebAssembly
        run: tools/build_wasm.sh
      - name: check the site, terminal included (don't deploy a broken site)
        working-directory: tools/check-site
        env: { REQUIRE_WASM: "1" }
        run: npm ci && node check.mjs
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with: { path: docs }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
