name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lessons + engine
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.mod }
      - name: gofmt
        run: |
          unformatted="$(git ls-files '*.go' | grep -v '^exercises/' | xargs gofmt -l)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      # go/exercises/* are the exercise track: they compile but their tests fail by design
      # (the exercises job checks them).
      - name: vet
        run: go list ./... | grep -v /exercises/ | xargs go vet
      - name: test
        run: go list ./... | grep -v /exercises/ | xargs go test
      - name: lesson demos run
        run: for d in cmd/lesson0*; do echo "::group::$d"; go run "./$d"; echo "::endgroup::"; done
      - name: golden queries (Volcano and VM)
        run: |
          go run ./cmd/engine -golden ../queries/golden.sql | diff - engine/testdata/golden.out
          go run ./cmd/engine -vm -golden ../queries/golden.sql | diff - engine/testdata/golden.out

  clojure:
    name: Clojure lessons + engine
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: clojure } }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with: { cli: 1.12.1.1561 }
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('clojure/deps.edn') }}
      - name: test
        run: clojure -M:test -d test
      - name: lesson demos run
        run: >
          clojure -M -e "(doseq [n '[lesson01.expressions lesson02.iterators lesson03.joins
          lesson04.aggregation lesson05.indexes lesson06.planner lesson07.bytecode]]
          (println \"::group::\" n) (require n) ((requiring-resolve (symbol (str n) \"-main\"))) (println \"::endgroup::\"))"
      - name: golden queries (Volcano and VM)
        run: |
          clojure -M -m engine.main --golden ../queries/golden.sql | diff - test/engine/golden.out
          clojure -M -m engine.main --vm --golden ../queries/golden.sql | diff - test/engine/golden.out

  exercises:
    name: Exercise track is current and fails as designed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.mod }
      - uses: actions/setup-java@v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with: { cli: 1.12.1.1561 }
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('clojure/deps.edn') }}
      - uses: astral-sh/setup-uv@v10.2.0
      # Regenerates every exercise from the reference markers, then checks: reference tests pass,
      # each exercise compiles/loads, and each exercise's tests fail.
      - name: regenerate + check
        run: uv run tools/make_exercises.py
      - name: generated files are committed
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::exercise track is stale: run 'uv run tools/make_exercises.py' and commit"; git diff --stat; exit 1; }

  site:
    name: Site loads with no errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: tools/check-site/package-lock.json }
      - uses: astral-sh/setup-uv@v10.2.0
      - name: syntax-check scripts
        run: git ls-files 'docs/*.js' | xargs -n1 node --check
      - name: links, cards, and every page in headless Chrome
        working-directory: tools/check-site
        run: npm ci && node check.mjs
      - name: Anki export builds from the cards
        run: uv run tools/cards_to_anki.py
